name: TOP-TY-LE-THANG-CAO-GPT
on:
  workflow_dispatch:
  push:
    paths:
      - "bot_research.py"
      - ".github/workflows/TOP-TY-LE-THANG-CAO-GPT.yml"
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Restore independent historical data
        run: |
          test -f stock_cache_seed.zip || { echo "ERROR: stock_cache_seed.zip missing"; exit 1; }
          rm -rf data && mkdir data
          unzip -q stock_cache_seed.zip -d data
          COUNT=$(find data -type f -name '*.csv' | wc -l)
          echo "Historical CSV files: $COUNT"
          test "$COUNT" -ge 400 || { echo "ERROR: historical dataset incomplete"; exit 1; }
      - name: Optimize Development then lock and evaluate Holdout
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python bot_research.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TOP-TY-LE-THANG-CAO-GPT-result
          path: |
            result.json
            development_diagnostics.json
          if-no-files-found: ignore
